<div class="categories-container page-fade-in">
  <div class="header-box">
    <span class="ninja-badge">PERGAMINHOS</span>
    <h2 class="title">Explore por Categoria</h2>
    <p class="subtitle">Selecione um gênero para navegar pelo catálogo</p>
  </div>

  <div class="categories-grid">
    <button class="category-card card-pop-in" style="animation-delay: 0.05s;" (click)="goToCategory(1)">
      <span>Romance</span>
      <small>Dojo →</small>
    </button>

    <button class="category-card card-pop-in" style="animation-delay: 0.10s;" (click)="goToCategory(2)">
      <span>Ação</span>
      <small>Dojo →</small>
    </button>

    <button class="category-card card-pop-in" style="animation-delay: 0.15s;" (click)="goToCategory(3)">
      <span>Terror</span>
      <small>Dojo →</small>
    </button>

    <button class="category-card card-pop-in" style="animation-delay: 0.20s;" (click)="goToCategory(5)">
      <span>Isekai</span>
      <small>Dojo →</small>
    </button>

    <button class="category-card card-pop-in" style="animation-delay: 0.25s;" (click)="goToCategory(6)">
      <span>Sports</span>
      <small>Dojo →</small>
    </button>

    <button class="category-card card-pop-in" style="animation-delay: 0.30s;" (click)="goToCategory(7)">
      <span>Clássicos</span>
      <small>Dojo →</small>
    </button>

    <button class="category-card card-pop-in highlight-card" style="animation-delay: 0.35s;" (click)="goToCategory(8)">
      <span>Todos os pergaminhos</span>
      <small>Ver Tudo →</small>
    </button>
  </div>
</div>
